<body>
  <main>
    <!-- The map stage sticks to the screen for the whole page: first over the
         story track (its scroll length is PACING.screens, js/pacing.js), then
         as a dimmed backdrop while the ending scrolls over it. -->
    <div class="story">
      <!-- The stage is a picture, not a landmark: the map is one image with a
           name. The story itself (js/story-text.js) is a hidden text version
           right after it; the visual title, cards and passes are aria-hidden. -->
      <div class="stage">
        <div id="map" class="map" role="img" aria-label="Dark world map showing my path from Georgia to South Dakota to the Czech Republic"></div>
        <div class="stage-dim" aria-hidden="true"></div>
        <div class="hud" aria-hidden="true"></div>
      </div>
      <div class="story-track" aria-hidden="true"></div>
      <section class="ending" aria-labelledby="ending-title">
        <div class="ending-inner">
          <h2 id="ending-title" class="ending-kicker">Get in touch</h2>
        </div>
      </section>
    </div>
  </main>

  <script src="vendor/gsap/gsap.min.js"></script>
