  <!-- GoatCounter (cookie-free visit statistics): the documented tag,
         <script data-goatcounter="https://zurablomidze.goatcounter.com/count"
                 async src="//gc.zgo.at/count.js"></script>
       added by this loader only on a real public host. On localhost, raw IP
       addresses (127.x, 10.x, 192.168.x, ...), single-word hosts, .local-style
       names and anything that is not http(s), the script is never requested,
       so my own servers and phone tests are never counted and make no
       request to another domain. (count.js also ignores local addresses on
       its own.) To leave my own browsers out of the live counts, open
       https://zurablomidze.com/#toggle-goatcounter once in each browser. -->
  <script>
    (function () {
      var h = location.hostname;
      var isPublic = /^https?:$/.test(location.protocol) &&
        /^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(h) &&                  // a dotted name: no IPv6, no single-word host
        !/^\d+(\.\d+){3}$/.test(h) &&                              // no raw IPv4 (127.x, 10.x, 172.16-31.x, 192.168.x, 169.254.x ...)
        !/\.(localhost|local|lan|home|internal|test|invalid|example)$/i.test(h);
      if (!isPublic) return;
      try {
        var s = document.createElement("script");
        s.async = true;
        s.setAttribute("data-goatcounter", "https://zurablomidze.goatcounter.com/count");
        s.src = "//gc.zgo.at/count.js";
        document.head.appendChild(s);
      } catch (e) { /* analytics must never break the page */ }
    })();
  </script>

<body>
  <main>
    <!-- The map stage sticks to the screen for the whole page: first over the
         story track (its scroll length is PACING.screens, js/pacing.js), then
         as a dimmed backdrop while the ending scrolls over it. -->
    <div class="story">
      <!-- The stage is a picture, not a landmark: the map is one labelled image
           with no controls of its own (the photo piles are real buttons beside
           the story cards, js/photos.js). The story itself (js/story-text.js)
           is a hidden text version right after it; the visual title, cards and
           passes are aria-hidden. -->
      <div class="stage">
        <div id="map" class="map" role="img" aria-label="Dark world map showing my path from Georgia to South Dakota to the Czech Republic"></div>
        <div class="stage-dim" aria-hidden="true"></div>
        <div class="hud" aria-hidden="true"></div>
      </div>

        <div class="ending-inner">
          <h2 id="ending-title" class="ending-kicker">Get in touch</h2>
        </div>
      </section>
    </div>
  </main>
